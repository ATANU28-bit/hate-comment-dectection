<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <style>
    .bg { fill: #071022 }
    .title { fill: #fff; font-family: 'Segoe UI', Arial; font-size: 18px }
    .step { fill: #ef4444; stroke: #7f1d1d; stroke-width:2; rx:6 }
    .ok { fill: #10b981; stroke: #064e3b; stroke-width:2; rx:6 }
    .text { fill: #fff; font-size:13px }
    .muted { fill: #cbd5e1; font-size:12px }
    .arrow { stroke: #94a3b8; stroke-width:2; marker-end: url(#a) }
  </style>
  <rect class="bg" width="1000" height="380" rx="8"/>
  <text x="30" y="36" class="title">Error Timeline & Troubleshooting — API Not Opening</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Steps -->
  <rect class="step" x="40" y="80" width="260" height="70" />
  <text class="text" x="60" y="110">1) Uvicorn started but /docs unreachable</text>
  <text class="muted" x="60" y="130">Symptom: connection refused or server immediately shutdown</text>

  <rect class="step" x="360" y="80" width="260" height="70" />
  <text class="text" x="380" y="110">2) ImportError: No module named 'src' / 'inference'</text>
  <text class="muted" x="380" y="130">Cause: Python path when running module vs script</text>

  <rect class="step" x="680" y="80" width="260" height="70" />
  <text class="text" x="700" y="110">3) Server startup completed then SHUTDOWN</text>
  <text class="muted" x="700" y="130">Likely due to reloader, permission or leftover process</text>

  <line class="arrow" x1="300" y1="115" x2="360" y2="115"/>
  <line class="arrow" x1="620" y1="115" x2="680" y2="115"/>

  <!-- Fixes -->
  <rect class="ok" x="160" y="200" width="220" height="80" />
  <text class="text" x="180" y="230">Fix: Use package import `from src.inference`</text>
  <text class="muted" x="180" y="250">Start uvicorn as module: `python -m uvicorn src.api:app`</text>

  <rect class="ok" x="520" y="200" width="260" height="80" />
  <text class="text" x="540" y="230">Fix: Kill old processes; ensure port free</text>
  <text class="muted" x="540" y="250">Use `Stop-Process -Id <pid>` (Windows PowerShell)</text>

  <line class="arrow" x1="270" y1="200" x2="180" y2="200"/>
  <line class="arrow" x1="490" y1="200" x2="520" y2="200"/>

  <text class="muted" x="30" y="320">Notes: When using reload, reloader spawns child processes—be mindful of which process is active and which PID to stop.</text>
</svg>