<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <style>
    .bg { fill: #0f172a; }
    .title { fill: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 20px; }
    .box { fill: #0ea5a6; stroke: #083344; stroke-width: 2; rx: 8; }
    .box2 { fill: #7c3aed; stroke: #3e185f; stroke-width: 2; rx: 8; }
    .text { fill: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
    .muted { fill: #cbd5e1; font-size:12px }
    .arrow { stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="500" rx="12"/>
  <text x="40" y="36" class="title">System Architecture — Hate Comment Detection</text>
  <text x="40" y="60" class="muted">Overview: Tokenization → Model (DistilBERT) → API → Client</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect class="box" x="40" y="100" width="220" height="100" />
    <text class="text" x="70" y="140">Client / App</text>
    <text class="muted" x="70" y="160">(Browser, Mobile, Service)</text>
  </g>

  <!-- API -->
  <g id="api">
    <rect class="box2" x="420" y="80" width="320" height="140" />
    <text class="text" x="520" y="110">FastAPI Server</text>
    <text class="muted" x="470" y="132">/health, /predict, /predict-batch</text>
  </g>

  <!-- Model -->
  <g id="model">
    <rect class="box" x="820" y="100" width="280" height="160" />
    <text class="text" x="870" y="140">Model: DistilBERT</text>
    <text class="muted" x="870" y="162">Fine-tuned (3-class)</text>
    <text class="muted" x="870" y="182">Path: models/hate-detection-balanced</text>
  </g>

  <!-- Arrows -->
  <line class="arrow" x1="260" y1="150" x2="420" y2="150" />
  <line class="arrow" x1="740" y1="150" x2="820" y2="150" />

  <!-- Tokenizer / Preprocessing box -->
  <g id="preproc">
    <rect class="box" x="420" y="250" width="240" height="90" />
    <text class="text" x="450" y="285">Tokenizer & Preprocessing</text>
    <text class="muted" x="450" y="305">(src/preprocess_dataset.py)</text>
  </g>

  <line class="arrow" x1="660" y1="200" x2="660" y2="250" />
  <line class="arrow" x1="660" y1="295" x2="820" y2="295" />

  <!-- DB / Storage -->
  <g id="storage">
    <rect x="40" y="240" width="300" height="120" rx="8" fill="#94a3b8" opacity="0.12" stroke="#94a3b8"/>
    <text class="muted" x="60" y="270">Data Storage</text>
    <text class="muted" x="60" y="290">- data/archive/</text>
    <text class="muted" x="60" y="310">- data/processed/</text>
    <text class="muted" x="60" y="330">- models/</text>
  </g>

  <!-- Notes -->
  <text class="muted" x="40" y="430">Legend: teal = service, purple = API layer, arrows = data flow</text>
</svg>